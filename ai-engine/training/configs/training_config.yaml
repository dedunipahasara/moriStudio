
# Cute3D AI Engine - Training Configuration

project:
  name: "Cute3D Studio"
  version: "1.0.0"

dataset:
  raw_dir: "datasets/raw"
  processed_dir: "datasets/processed"
  annotations_file: "datasets/annotations/captions.json"
  metadata_dir: "datasets/metadata"
  image_size: 32
  image_channels: 3
  train_split: 0.8
  validation_split: 0.2

model:
  text_embedding_dim: 64
  text_feature_dim: 128
  image_size: 32
  image_channels: 3
  base_channels: 16
  num_timesteps: 100

training:
  epochs: 20
  batch_size: 2
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 0
  save_every: 1
  seed: 42

optimizer:
  name: "AdamW"

scheduler:
  name: "CosineAnnealingLR"
  T_max: 20
  eta_min: 0.000001

device:
  use_cuda: true
  mixed_precision: false

paths:
  checkpoints: "checkpoints"
  experiments: "training/experiments"
  logs: "training/logs"
  evaluation: "training/evaluation"
  outputs: "outputs"

